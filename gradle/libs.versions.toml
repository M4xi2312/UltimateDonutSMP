[versions]
# Production artifacts compile against the oldest supported API.
# This prevents accidental linkage to methods introduced only in newer
# server releases while still allowing separate latest-API checks
# (pass -PserverApi=group:artifact:version to swap the server API).
spigot-api = "1.21.10-R0.1-SNAPSHOT"
adventure = "5.2.0"
junit = "6.1.3"
shadow = "9.6.1"

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
protocollib = { module = "com.comphenix.protocol:ProtocolLib", version = "5.3.0" }
skinsrestorer-api = { module = "net.skinsrestorer:skinsrestorer-api", version = "15.12.6" }
placeholderapi = { module = "me.clip:placeholderapi", version = "2.12.3" }
apollo-api = { module = "com.lunarclient:apollo-api", version = "1.3.0" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version = "1.7.1" }
floodgate-api = { module = "org.geysermc.floodgate:api", version = "2.2.5-SNAPSHOT" }
luckperms-api = { module = "net.luckperms:api", version = "5.5" }
voicechat-api = { module = "de.maxhenkel.voicechat:voicechat-api", version = "2.6.24" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version = "26.7.0" }
hikaricp = { module = "com.zaxxer:HikariCP", version = "7.1.0" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version = "5.13.0" }
jedis = { module = "redis.clients:jedis", version = "8.0.2" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
